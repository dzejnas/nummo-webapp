<div class="page-header">
  <h1 class="h3 fw-bold mb-0">Payment requests</h1>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#request-modal">
    <i class="bi bi-envelope-plus"></i> Request money
  </button>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Date</th><th>From</th><th>To pay</th><th>Note</th><th>Status</th><th class="text-end">Amount</th><th></th></tr></thead>
      <tbody id="requests-table">
        <tr>
          <td>01.11.2026</td><td>Amina Hodzic</td><td>Tarik Begic</td><td>Pizza night</td>
          <td><span class="badge text-bg-warning">pending</span></td><td class="text-end">€15.00</td>
          <td class="text-end">
            <button class="btn btn-sm btn-success">Pay</button>
            <button class="btn btn-sm btn-outline-secondary">Decline</button>
          </td>
        </tr>
        <tr>
          <td>28.10.2026</td><td>Tarik Begic</td><td>Amina Hodzic</td><td>Taxi</td>
          <td><span class="badge text-bg-success">paid</span></td><td class="text-end">€8.00</td><td></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="request-modal" tabindex="-1" aria-labelledby="request-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="request-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="request-modal-title">Request money</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="req-payer">Who should pay?</label>
          <select class="form-select" id="req-payer" name="payer_id"><option value="3">Tarik Begic</option></select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="req-amount">Amount (EUR)</label>
          <input type="number" class="form-control" id="req-amount" name="amount" min="0.01" step="0.01" required>
        </div>
        <div class="mb-0">
          <label class="form-label" for="req-note">Note</label>
          <input type="text" class="form-control" id="req-note" name="note" maxlength="255">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Send request</button>
      </div>
    </form>
  </div>
</div>
