<div class="card auth-card p-4">
  <h2 class="h4 fw-bold text-center mb-1">Create an account</h2>
  <p class="text-muted text-center mb-4">Send and receive money in seconds</p>

  <form id="register-form" novalidate>
    <div class="mb-3">
      <label for="register-name" class="form-label">Full name</label>
      <input type="text" class="form-control" id="register-name" name="name" required minlength="2" maxlength="100">
    </div>
    <div class="mb-3">
      <label for="register-email" class="form-label">Email</label>
      <input type="email" class="form-control" id="register-email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="register-currency" class="form-label">Main currency</label>
      <select class="form-select" id="register-currency" name="currency">
        <option value="EUR" selected>EUR — Euro</option>
        <option value="USD">USD — US Dollar</option>
        <option value="GBP">GBP — British Pound</option>
        <option value="CHF">CHF — Swiss Franc</option>
      </select>
    </div>
    <div class="mb-3">
      <label for="register-password" class="form-label">Password</label>
      <input type="password" class="form-control" id="register-password" name="password" required minlength="6">
      <div class="form-text">At least 6 characters.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Register</button>
  </form>

  <p class="text-center small mt-3 mb-0">
    Already registered? <a href="#login">Log in</a>
  </p>
</div>
