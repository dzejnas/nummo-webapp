<h1 class="mb-4">Dashboard</h1>
<p>Welcome to your dashboard! 🧭</p>

<div class="row mb-4">
  <div class="col-md-4">
    <div class="card text-white bg-primary mb-3">
      <div class="card-body">
        <h5 class="card-title">Balance</h5>
        <h3 class="card-text fs-4" id="balance">0.00</h3>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-white bg-success mb-3">
      <div class="card-body">
        <h5 class="card-title">Income</h5>
        <h3 class="card-text fs-4" id="income">0.00</h3>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-white bg-danger mb-3">
      <div class="card-body">
        <h5 class="card-title">Expenses</h5>
        <h3 class="card-text fs-4" id="expenses">0.00</h3>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h5 class="card-title">Transactions Chart</h5>
    <canvas id="transactionsChart" height="150"></canvas>
  </div>
</div>
