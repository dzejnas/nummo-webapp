<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nummo — Peer-to-Peer Payments</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/img/logo.svg">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white border-bottom fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="#dashboard">
        <img src="assets/img/logo.svg" alt="" width="28" height="28" class="me-1"> Nummo
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- data-show="user" = only when logged in, "admin" = only admins, "guest" = only when logged out -->
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item" data-show="user"><a class="nav-link" href="#dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item" data-show="user"><a class="nav-link" href="#transactions"><i class="bi bi-arrow-left-right"></i> Transactions</a></li>
          <li class="nav-item" data-show="user"><a class="nav-link" href="#requests"><i class="bi bi-envelope-paper"></i> Requests</a></li>
          <li class="nav-item" data-show="user"><a class="nav-link" href="#contacts"><i class="bi bi-people"></i> Contacts</a></li>
          <li class="nav-item" data-show="user"><a class="nav-link" href="#merchants"><i class="bi bi-shop"></i> Merchants</a></li>
          <li class="nav-item dropdown" data-show="admin">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-shield-lock"></i> Admin
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#users">Users</a></li>
              <li><a class="dropdown-item" href="#categories">Categories</a></li>
            </ul>
          </li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item" data-show="user">
            <a class="nav-link" href="#profile"><i class="bi bi-person-circle"></i> <span id="nav-user-name">Profile</span></a>
          </li>
          <li class="nav-item" data-show="user">
            <a class="nav-link" href="#logout" id="logout-link"><i class="bi bi-box-arrow-right"></i> Log out</a>
          </li>
          <li class="nav-item" data-show="guest"><a class="nav-link" href="#login"><i class="bi bi-box-arrow-in-right"></i> Log in</a></li>
          <li class="nav-item" data-show="guest"><a class="nav-link" href="#register"><i class="bi bi-person-plus"></i> Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" id="app">
    <!-- router.js loads views/<page>.html here -->
  </main>

  <footer class="border-top py-3 text-center text-muted small">
    &copy; 2026 Nummo &middot; Web Programming project by Džejna Sejfić
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Core: configuration, login state, API access, UI helpers -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/validation.js"></script>
  <!-- Services: the only code that calls the backend -->
  <script src="js/services/services.js"></script>
  <!-- Pages: one controller per view -->
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transactions.js"></script>
  <script src="js/pages/requests.js"></script>
  <script src="js/pages/contacts.js"></script>
  <script src="js/pages/merchants.js"></script>
  <script src="js/pages/categories.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/profile.js"></script>
  <!-- Router last: it starts the app -->
  <script src="js/router.js"></script>
</body>
</html>
