<!-- =========================================================
     NUMMO APP — LOGIN VIEW
     Clean, responsive login form
========================================================= -->

<section class="d-flex align-items-center justify-content-center vh-100 fade-in">
  <div class="card shadow-lg p-4" style="max-width: 420px; width: 100%;">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-primary">Welcome to Nummo 💸</h2>
      <p class="text-muted mb-0">Sign in to access your account</p>
    </div>

    <form id="login-form" autocomplete="off">
      <!-- Email -->
      <div class="mb-3">
        <label for="login-email" class="form-label fw-semibold">Email</label>
        <input 
          type="email" 
          class="form-control" 
          id="login-email" 
          placeholder="you@example.com" 
          required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="login-password" class="form-label fw-semibold">Password</label>
        <input 
          type="password" 
          class="form-control" 
          id="login-password" 
          placeholder="••••••••" 
          required>
      </div>

      <!-- Remember me + forgot password -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small text-muted" for="rememberMe">
            Remember me
          </label>
        </div>
        <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
      </div>

      <!-- Submit -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary py-2 fw-semibold">Login</button>
      </div>
    </form>

    <div class="text-center mt-4">
      <p class="small mb-0 text-muted">
        Don’t have an account?
        <a href="#register" class="text-primary text-decoration-none fw-semibold">Register</a>
      </p>
    </div>
  </div>
</section>
