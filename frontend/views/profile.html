<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card p-4">
      <div class="d-flex align-items-center gap-3 mb-4">
        <i class="bi bi-person-circle display-5 text-primary"></i>
        <div>
          <h1 class="h4 fw-bold mb-0" id="profile-title"></h1>
          <span id="profile-role"></span>
          <span class="text-muted small ms-2" id="profile-balance"></span>
        </div>
      </div>

      <form id="profile-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="profile-name">Full name</label>
          <input type="text" class="form-control" id="profile-name" name="name" required minlength="2" maxlength="100">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="profile-email">Email</label>
          <input type="email" class="form-control" id="profile-email" name="email" required maxlength="190">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="profile-currency">Display currency</label>
          <select class="form-select" id="profile-currency" name="currency">
            <option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="profile-password">New password</label>
          <input type="password" class="form-control" id="profile-password" name="password" minlength="6" maxlength="72"
                 placeholder="Leave empty to keep the current one" autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </div>
  </div>
</div>
