<div class="card auth-card p-4">
  <h1 class="h4 fw-bold text-center mb-1">Welcome back</h1>
  <p class="text-muted text-center mb-4">Log in to your Nummo account</p>

  <form id="login-form" novalidate>
    <div class="mb-3">
      <label for="login-email" class="form-label">Email</label>
      <input type="email" class="form-control" id="login-email" name="email" placeholder="you@example.com" required autocomplete="email">
      <div class="invalid-feedback"></div>
    </div>
    <div class="mb-3">
      <label for="login-password" class="form-label">Password</label>
      <input type="password" class="form-control" id="login-password" name="password" required minlength="6" autocomplete="current-password">
      <div class="invalid-feedback"></div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Log in</button>
  </form>

  <p class="text-center small mt-3 mb-0">
    No account yet? <a href="#register">Register</a>
  </p>
</div>
