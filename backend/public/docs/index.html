<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nummo API Docs</title>

  <!-- Swagger UI CDN -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />

  <style>
    body {
      margin: 0;
      background: #0d1117;
      font-family: Inter, Arial, sans-serif;
    }

    #swagger-ui {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: #111827;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
    }

    #nummo-footer {
      text-align: center;
      margin: 40px 0;
      color: #6b7280;
      font-size: 14px;
    }

    #theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      background: #ffd34d;
      color: black;
      border: none;
      padding: 8px 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      z-index: 999;
    }
  </style>
</head>

<body>
  <button id="theme-toggle">🌙 Dark Mode</button>

  <div id="swagger-ui"></div>

  <div id="nummo-footer">
    © 2025 Nummo — Built with ❤️ by Džejna Sejfić
  </div>

  <!-- Swagger JS from CDN -->
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-standalone-preset.js"></script>

  <script>
    window.onload = function () {
      const ui = SwaggerUIBundle({
        url: "/api/docs",           // <-- YOUR API YAML
        dom_id: "#swagger-ui",
        layout: "StandaloneLayout",
        deepLinking: true,
        filter: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 0,
        displayRequestDuration: true,
        tryItOutEnabled: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ]
      });

      window.ui = ui;

      // THEME TOGGLE
      const btn = document.getElementById("theme-toggle");
      btn.onclick = () => {
        const dark = document.body.style.background === "white";
        document.body.style.background = dark ? "#0d1117" : "white";
        btn.innerText = dark ? "🌙 Dark Mode" : "☀️ Light Mode";
      };
    };
  </script>
</body>
</html>
