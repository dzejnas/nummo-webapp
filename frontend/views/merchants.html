<div class="page-header">
  <h1 class="h3 fw-bold mb-0">Merchants</h1>
  <!-- Admin only -->
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#merchant-modal">
    <i class="bi bi-plus-lg"></i> Add merchant
  </button>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Name</th><th>Category</th><th>Contact email</th><th></th></tr></thead>
      <tbody id="merchants-table">
        <tr><td>Bingo Market</td><td>Shopping</td><td>info@bingo.example</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>GRAS Sarajevo</td><td>Transport</td><td>info@gras.example</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td></tr>
        <tr><td>Cinema City</td><td>Entertainment</td><td>hello@cinemacity.example</td>
          <td class="text-end"><button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="merchant-modal" tabindex="-1" aria-labelledby="merchant-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="merchant-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="merchant-modal-title">Merchant</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="merchant-name">Name</label>
          <input type="text" class="form-control" id="merchant-name" name="name" required minlength="2" maxlength="120">
        </div>
        <div class="mb-3">
          <label class="form-label" for="merchant-category">Category</label>
          <select class="form-select" id="merchant-category" name="category_id">
            <option value="1">Food</option><option value="2">Transport</option><option value="3">Shopping</option>
            <option value="4">Bills</option><option value="5">Entertainment</option><option value="6">Other</option>
          </select>
        </div>
        <div class="mb-0">
          <label class="form-label" for="merchant-email">Contact email</label>
          <input type="email" class="form-control" id="merchant-email" name="contact_email">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
