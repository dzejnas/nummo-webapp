<div class="page-header">
  <h1 class="h3 fw-bold mb-0">Contacts</h1>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#contact-modal">
    <i class="bi bi-person-plus"></i> Add contact
  </button>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Added</th><th></th></tr></thead>
      <tbody id="contacts-table"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="contact-modal" tabindex="-1" aria-labelledby="contact-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="contact-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="contact-modal-title">Add contact</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="contact-email">Their Nummo email</label>
        <input type="email" class="form-control" id="contact-email" name="email" required maxlength="190">
        <div class="invalid-feedback"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add</button>
      </div>
    </form>
  </div>
</div>
