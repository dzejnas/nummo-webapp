<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nummo — Milestone 1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Nummo</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#/transactions">Transactions</a></li>
        <li class="nav-item"><a class="nav-link" href="#/profile">Profile</a></li>
        <li class="nav-item"><a class="nav-link" href="#/login">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="#/register">Register</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-4">
  <!-- Views (hidden/shown by JS router) -->
  <section id="view-dashboard" class="app-view">
    <h1>Dashboard</h1>
    <div id="balance" class="mb-3">Balance: 0.00</div>
    <div id="chart-placeholder">(chart will go here)</div>
  </section>

  <section id="view-transactions" class="app-view" style="display:none;">
    <h1>Transactions</h1>
    <div id="transactions-list"></div>
  </section>

  <section id="view-profile" class="app-view" style="display:none;">
    <h1>Profile</h1>
    <p>Profile form (static)</p>
  </section>

  <section id="view-login" class="app-view" style="display:none;">
    <h1>Login</h1>
    <form id="login-form">
      <div class="mb-3"><input class="form-control" id="login-email" placeholder="Email"></div>
      <div class="mb-3"><input type="password" class="form-control" id="login-password" placeholder="Password"></div>
      <button class="btn btn-primary" type="submit">Login</button>
    </form>
  </section>

  <section id="view-register" class="app-view" style="display:none;">
    <h1>Register</h1>
    <form id="register-form">
      <div class="mb-3"><input class="form-control" id="reg-name" placeholder="Name" required></div>
      <div class="mb-3"><input class="form-control" id="reg-email" placeholder="Email" required></div>
      <div class="mb-3"><input type="password" class="form-control" id="reg-password" placeholder="Password" required></div>
      <button class="btn btn-success" type="submit">Register</button>
    </form>
  </section>
 </div>

<script src="js/main.js"></script>
</body>
</html>
