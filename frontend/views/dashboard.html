<div class="page-header">
  <h1 class="h3 fw-bold mb-0">Hi, <span id="dashboard-name"></span></h1>
  <a href="#transactions" class="btn btn-primary"><i class="bi bi-send"></i> Send money</a>
</div>

<div class="row g-3 mb-4">
  <div class="col-12 col-md-4">
    <div class="card stat-card p-3">
      <div class="text-muted small">Balance</div>
      <div class="stat-value" id="stat-balance">…</div>
      <div class="text-muted small" id="stat-balance-converted"></div>
    </div>
  </div>
  <div class="col-6 col-md-4">
    <div class="card stat-card p-3">
      <div class="text-muted small">Received this month</div>
      <div class="stat-value amount-in" id="stat-received">…</div>
    </div>
  </div>
  <div class="col-6 col-md-4">
    <div class="card stat-card p-3">
      <div class="text-muted small">Spent this month</div>
      <div class="stat-value amount-out" id="stat-spent">…</div>
    </div>
  </div>
</div>

<div class="row g-3 mb-4">
  <div class="col-12 col-lg-7">
    <div class="card p-3 h-100">
      <h2 class="h6 fw-bold">Spending by category</h2>
      <div class="chart-box"><canvas id="spending-chart"></canvas></div>
      <p class="text-muted small d-none mb-0" id="spending-empty">No completed payments yet.</p>
    </div>
  </div>

  <!-- External API feature: live exchange rates from the Frankfurter API -->
  <div class="col-12 col-lg-5">
    <div class="card p-3 h-100" id="converter-card">
      <h2 class="h6 fw-bold"><i class="bi bi-currency-exchange"></i> Currency converter</h2>
      <p class="text-muted small">Live exchange rates (Frankfurter API)</p>
      <form id="converter-form" class="row g-2" novalidate>
        <div class="col-12">
          <label class="visually-hidden" for="converter-amount">Amount</label>
          <input type="number" class="form-control" id="converter-amount" name="amount" value="100" min="0.01" step="0.01" required>
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-5">
          <label class="visually-hidden" for="converter-from">From</label>
          <select class="form-select" id="converter-from" name="from">
            <option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option>
          </select>
        </div>
        <div class="col-2 text-center align-self-center"><i class="bi bi-arrow-right"></i></div>
        <div class="col-5">
          <label class="visually-hidden" for="converter-to">To</label>
          <select class="form-select" id="converter-to" name="to">
            <option>USD</option><option>EUR</option><option>GBP</option><option>CHF</option>
          </select>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-outline-primary w-100">Convert</button>
        </div>
      </form>
      <div class="mt-3 fs-5 fw-semibold" id="converter-result" aria-live="polite"></div>
      <div class="text-muted small" id="converter-date"></div>
    </div>
  </div>
</div>

<div class="card p-3">
  <div class="page-header">
    <h2 class="h6 fw-bold mb-0">Recent transactions</h2>
    <a href="#transactions" class="btn btn-sm btn-outline-primary">View all</a>
  </div>
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Date</th><th>To / From</th><th>Category</th><th class="text-end">Amount</th></tr></thead>
      <tbody id="recent-transactions"></tbody>
    </table>
  </div>
</div>
