openapi: 3.0.3
info:
  title: Nummo API
  description: >
    Official REST API documentation for the **Nummo WebApp (Milestone 3)**.  
    Developed by Džejna Sejfić — built with FlightPHP, DAO and Service Architecture.
  version: "1.0.0"
  contact:
    name: Nummo Dev Team
    email: support@nummo.ba

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Users
    description: Manage application users
  - name: Categories
    description: Manage spending categories
  - name: Merchants
    description: Manage merchant information
  - name: Contacts
    description: Manage user-to-user contacts
  - name: Transactions
    description: Manage payment transactions

paths:
  /api/users:
    get:
      tags: [Users]
      summary: Get all users
      responses:
        '200':
          description: List of all registered users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
            example:
              name: "Alice"
              email: "alice@example.com"
              password: "secret123"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Update user by ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200': { description: Updated user }
    delete:
      tags: [Users]
      summary: Delete user by ID
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200': { description: User deleted }

  /api/categories:
    get:
      tags: [Categories]
      summary: Get all categories
      responses:
        '200':
          description: List of all categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201': { description: Category created }

  /api/merchants:
    get:
      tags: [Merchants]
      summary: Get all merchants
      responses:
        '200':
          description: List of all merchants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Merchant' }

  /api/contacts:
    get:
      tags: [Contacts]
      summary: Get all contacts
      responses:
        '200':
          description: List of all user contacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
    post:
      tags: [Contacts]
      summary: Create a contact relationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201': { description: Contact created }

  /api/transactions:
    get:
      tags: [Transactions]
      summary: Get all transactions
      responses:
        '200':
          description: List of all transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
    post:
      tags: [Transactions]
      summary: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
            example:
              user_id: 4
              merchant_id: 1
              category_id: 1
              amount: 49.99
              currency: BAM
      responses:
        '201': { description: Transaction created }

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Unique numeric identifier

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Alice" }
        email: { type: string, example: "alice@example.com" }
        role: { type: string, example: "user" }
        created_at: { type: string, example: "2025-11-16 16:00:00" }

    UserInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        role: { type: string }

    Category:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Food" }
        description: { type: string, example: "Groceries & dining" }

    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Merchant:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "DM Drogerie" }
        category_id: { type: integer, example: 1 }
        description: { type: string, example: "Retail & Health" }

    Contact:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        contact_id: { type: integer }
        alias: { type: string, example: "Mof" }

    ContactInput:
      type: object
      required: [user_id, contact_id]
      properties:
        user_id: { type: integer }
        contact_id: { type: integer }
        alias: { type: string }

    Transaction:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        merchant_id: { type: integer }
        category_id: { type: integer }
        amount: { type: number }
        currency: { type: string }
        note: { type: string, nullable: true }
        status: { type: string, example: "PENDING" }
        created_at: { type: string, example: "2025-11-16 17:30:00" }

    TransactionInput:
      type: object
      required: [user_id, merchant_id, category_id, amount, currency]
      properties:
        user_id: { type: integer }
        merchant_id: { type: integer }
        category_id: { type: integer }
        amount: { type: number }
        currency: { type: string }
        note: { type: string, nullable: true }
