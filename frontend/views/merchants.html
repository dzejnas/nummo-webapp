<div class="page-header">
  <h1 class="h3 fw-bold mb-0">Merchants</h1>
  <button class="btn btn-primary d-none" id="new-merchant-button" data-admin-only>
    <i class="bi bi-plus-lg"></i> Add merchant
  </button>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Name</th><th>Category</th><th>Contact email</th><th></th></tr></thead>
      <tbody id="merchants-table"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="merchant-modal" tabindex="-1" aria-labelledby="merchant-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="merchant-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="merchant-modal-title">Merchant</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="mb-3">
          <label class="form-label" for="merchant-name">Name</label>
          <input type="text" class="form-control" id="merchant-name" name="name" required minlength="2" maxlength="120">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="merchant-category">Category</label>
          <select class="form-select" id="merchant-category" name="category_id"></select>
        </div>
        <div class="mb-0">
          <label class="form-label" for="merchant-email">Contact email</label>
          <input type="email" class="form-control" id="merchant-email" name="contact_email" maxlength="190">
          <div class="invalid-feedback"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
