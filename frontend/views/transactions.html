<!-- =========================================================
     NUMMO APP — TRANSACTIONS VIEW
     Dynamic list with filters & responsive table
========================================================= -->

<section class="container py-4 fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-primary mb-1">Transactions</h2>
      <p class="text-muted mb-0">Track your recent payments and transfers</p>
    </div>

    <div>
      <button class="btn btn-sm btn-outline-primary" id="refresh-transactions">
        <i class="bi bi-arrow-repeat"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-4 border-0 shadow-sm rounded-4">
    <div class="card-body">
      <form id="filter-form" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="filter-category" class="form-label fw-semibold">Category</label>
          <select class="form-select" id="filter-category">
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="filter-status" class="form-label fw-semibold">Status</label>
          <select class="form-select" id="filter-status">
            <option value="">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="col-md-4 d-grid">
          <button type="submit" class="btn btn-primary fw-semibold">
            Apply Filters
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- ============================= -->
<!-- Add Transaction Form          -->
<!-- ============================= -->
<div class="card shadow-sm mb-4 p-4">
  <h5 class="mb-3 text-primary">
    <i class="bi bi-plus-circle"></i> Add Transaction
  </h5>
  <form id="add-transaction-form" class="row g-3">
    <div class="col-md-6">
      <label for="receiver_id" class="form-label">Receiver ID</label>
      <input type="number" class="form-control" id="receiver_id" placeholder="Enter receiver ID" required />
    </div>
    <div class="col-md-6">
      <label for="amount" class="form-label">Amount ($)</label>
      <input type="number" class="form-control" id="amount" placeholder="Enter amount" required step="0.01" />
    </div>

    <div class="col-md-6">
      <label for="category" class="form-label">Category</label>
      <select id="category" class="form-select">
        <option value="1">Food</option>
        <option value="2">Transport</option>
        <option value="3">Shopping</option>
        <option value="4">Entertainment</option>
      </select>
    </div>

    <div class="col-md-6">
      <label for="note" class="form-label">Note</label>
      <input type="text" class="form-control" id="note" placeholder="Optional note" />
    </div>

    <div class="col-12 text-end">
      <button type="submit" class="btn btn-success">
        <i class="bi bi-send"></i> Send Money
      </button>
    </div>
  </form>
</div>


  <!-- Transactions Table -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body">
      <h5 class="card-title fw-bold mb-3">
        <i class="bi bi-credit-card-2-front text-primary"></i> Transaction History
      </h5>

      <div id="transactions-list">
        <!-- JS will dynamically populate this table -->
        <div class="text-center text-muted py-4">
          <div class="spinner-border text-primary mb-2" role="status"></div>
          <p class="mb-0 small">Loading transactions...</p>
        </div>
      </div>
    </div>
  </div>
</section>
