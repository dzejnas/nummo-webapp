<!-- =========================================================
     NUMMO APP — TRANSACTIONS VIEW
     Dynamic list with filters & responsive table
========================================================= -->

<section class="container py-4 fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-primary mb-1">Transactions</h2>
      <p class="text-muted mb-0">Track your recent payments and transfers</p>
    </div>

    <div>
      <button class="btn btn-sm btn-outline-primary" id="refresh-transactions">
        <i class="bi bi-arrow-repeat"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-4 border-0 shadow-sm rounded-4">
    <div class="card-body">
      <form id="filter-form" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="filter-category" class="form-label fw-semibold">Category</label>
          <select class="form-select" id="filter-category">
            <option value="">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="filter-status" class="form-label fw-semibold">Status</label>
          <select class="form-select" id="filter-status">
            <option value="">All</option>
            <option value="completed">Completed</option>
            <option value="pending">Pending</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="col-md-4 d-grid">
          <button type="submit" class="btn btn-primary fw-semibold">
            Apply Filters
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Transactions Table -->
  <div class="card shadow-sm border-0 rounded-4">
    <div class="card-body">
      <h5 class="card-title fw-bold mb-3">
        <i class="bi bi-credit-card-2-front text-primary"></i> Transaction History
      </h5>

      <div id="transactions-list">
        <!-- JS will dynamically populate this table -->
        <div class="text-center text-muted py-4">
          <div class="spinner-border text-primary mb-2" role="status"></div>
          <p class="mb-0 small">Loading transactions...</p>
        </div>
      </div>
    </div>
  </div>
</section>
