<div class="page-header">
  <h1 class="h3 fw-bold mb-0">Users <span class="badge text-bg-secondary fs-6">admin</span></h1>
  <button class="btn btn-primary" id="new-user-button"><i class="bi bi-person-plus"></i> Add user</button>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Currency</th><th class="text-end">Balance (EUR, simulated)</th><th></th></tr></thead>
      <tbody id="users-table"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="user-modal" tabindex="-1" aria-labelledby="user-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <form class="modal-content" id="user-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="user-modal-title">User</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="id">
        <div class="mb-3">
          <label class="form-label" for="user-name">Name</label>
          <input type="text" class="form-control" id="user-name" name="name" required minlength="2" maxlength="100">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="user-email">Email</label>
          <input type="email" class="form-control" id="user-email" name="email" required maxlength="190">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="user-password">Password</label>
          <input type="password" class="form-control" id="user-password" name="password" minlength="6" maxlength="72" autocomplete="new-password">
          <div class="form-text" id="user-password-help">At least 6 characters.</div>
          <div class="invalid-feedback"></div>
        </div>
        <div class="row g-2">
          <div class="col-4">
            <label class="form-label" for="user-role">Role</label>
            <select class="form-select" id="user-role" name="role"><option>user</option><option>admin</option></select>
          </div>
          <div class="col-4">
            <label class="form-label" for="user-currency">Currency</label>
            <select class="form-select" id="user-currency" name="currency"><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option></select>
          </div>
          <div class="col-4">
            <label class="form-label" for="user-balance">Balance</label>
            <input type="number" class="form-control" id="user-balance" name="balance" min="0" step="0.01" value="0">
            <div class="invalid-feedback"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
